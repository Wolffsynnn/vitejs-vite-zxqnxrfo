<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EuriaMobile | EuriaApps</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    
    <!-- ÉCRAN 1 : CONNEXION (CraftID) -->
    <div id="login-screen" class="screen active">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-logo">
            <!-- Nouvelle icône CraftID -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 50px; height: 50px; color: #a78bfa;">
              <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
              <circle cx="9" cy="10" r="2"></circle>
              <path d="M15 8h2"></path>
              <path d="M15 12h2"></path>
              <path d="M7 16h10"></path>
            </svg>
          </div>
          <h1 class="auth-title">CraftID</h1>
          <p class="auth-subtitle">Connecte-toi pour accéder à EuriaApps</p>
          
          <button id="discord-login-btn" class="btn-discord">
            <svg width="24" height="24" viewBox="0 0 127.14 96.36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            Se connecter avec Discord
          </button>
          <p class="auth-footer">Serveur Minecraft RP • EuriaApps</p>
        </div>
      </div>
    </div>

    <!-- ÉCRAN 2 : HUB EURIAMOBILE -->
    <div id="hub-screen" class="screen">
      <header class="top-bar">
        <div class="top-bar-left">
          <span class="brand">EuriaMobile</span>
          <span class="divider">|</span>
          <span class="sub-brand">EuriaApps - Moonlight Studio</span>
        </div>
        <div class="top-bar-right">
          <button id="notif-btn" class="icon-btn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px; color: #9ca3af;">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <button id="logout-btn" class="icon-btn text-red" title="Déconnexion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px; color: #ef4444;">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <main class="hub-main">
        <div class="apps-grid">
          
          <!-- PayCraft (Billet / Dollar) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #22c55e, #16a34a);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
              </svg>
            </div>
            <span>PayCraft</span>
          </a>
          
          <!-- MapLoad (Carte / Localisation) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <span>MapLoad</span>
          </a>
          
          <!-- MarketPlace (Panier) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
            </div>
            <span>MarketPlace</span>
          </a>
          
          <!-- SafeCity (Bouclier) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #1d4ed8, #1e3a8a);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </div>
            <span>SafeCity</span>
          </a>
          
          <!-- VitaLine (Croix / Santé) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v16m-8-8h16"></path>
              </svg>
            </div>
            <span>VitaLine</span>
          </a>
          
          <!-- GoTaxi (Voiture) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #eab308, #ca8a04);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7.5c-.7 0-1.3.3-1.8.7C4.8 8.6 3 10 3 10s-2.7.6-4.5 1.1c-.8.2-1.5 1-1.5 1.9v3c0 .6.4 1 1 1h2"></path>
                <circle cx="7" cy="17" r="2"></circle>
                <path d="M9 17h6"></path>
                <circle cx="17" cy="17" r="2"></circle>
              </svg>
            </div>
            <span>GoTaxi</span>
          </a>
          
          <!-- CraftID (Carte d'identité) -->
          <a href="#" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
                <circle cx="9" cy="10" r="2"></circle>
                <path d="M15 8h2"></path>
                <path d="M15 12h2"></path>
                <path d="M7 16h10"></path>
              </svg>
            </div>
            <span>CraftID</span>
          </a>
          
          <!-- AdminZone (Dossier / Paramètres) -->
          <a href="#" id="adminzone-btn" class="app">
            <div class="app-icon" style="background: linear-gradient(135deg, #6b7280, #4b5563);">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <line x1="9" y1="14" x2="15" y2="14"></line>
              </svg>
            </div>
            <span>AdminZone</span>
          </a>

        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
